<style>
:root{
  --ink:#1F2D3D; --ink2:#34495E; --accent:#F59E0B; --bg:#F7F4EF;
  --card:#FFFFFF; --line:#E8E3D8; --txt:#22303F; --muted:#7A8699;
  --radius:12px; --shadow:0 1px 3px rgba(31,45,61,.08),0 4px 14px rgba(31,45,61,.06);
  --primary:#1E3A8A; --accent2:#1E3A8A;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);padding:8px;font-size:12px;color:var(--txt);font-weight:400;-webkit-font-smoothing:antialiased;}
button{touch-action:manipulation;font-family:inherit;}
.header{background:#1E3A8A;color:#fff;border-radius:var(--radius);padding:10px 14px;margin-bottom:8px;box-shadow:var(--shadow);}
.card{background:var(--card);border-radius:var(--radius);padding:9px 11px;margin-bottom:8px;box-shadow:var(--shadow);border:1px solid var(--line);}
.grid-nav{display:grid;grid-template-columns:32px 42px repeat(5,1fr) 36px;font-size:12px;text-align:center;padding:4px 1px;align-items:center;border-bottom:1px solid #eee;column-gap:1px;}
.grid-nav-m{display:grid;grid-template-columns:28px 34px repeat(5,1fr) 32px repeat(5,1fr) 32px;font-size:10.5px;text-align:center;padding:4px 1px;align-items:center;border-bottom:1px solid #eee;column-gap:1px;}
.grid-nav-n6{display:grid;grid-template-columns:32px 42px repeat(6,1fr) 34px 34px 34px;font-size:11px;text-align:center;padding:4px 1px;align-items:center;border-bottom:1px solid #eee;column-gap:1px;}
.grid-hdr-n6{display:grid;grid-template-columns:32px 42px repeat(6,1fr) 34px 34px 34px;background:var(--ink);color:#fff;font-size:8.5px;font-weight:700;text-align:center;padding:5px 1px;letter-spacing:.3px;column-gap:1px;}
.grid-nav-n6>div,.grid-hdr-n6>div{display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;min-width:0;}
.grid-nav-n6>div:not(:last-child){border-right:1px solid rgba(31,45,61,.06);}
.grid-hdr-n6>div:not(:last-child){border-right:1px solid rgba(255,255,255,.12);}
.grid-nav-n6:nth-child(even){background:#F8FAFF !important;}
.grid-hdr{display:grid;grid-template-columns:32px 42px repeat(5,1fr) 36px;background:var(--ink);color:#fff;font-size:9px;font-weight:700;text-align:center;padding:5px 1px;letter-spacing:.3px;column-gap:1px;}
.grid-hdr-m{display:grid;grid-template-columns:28px 34px repeat(5,1fr) 32px repeat(5,1fr) 32px;background:#111F33;color:#fff;font-size:8.2px;font-weight:700;text-align:center;padding:5px 1px;letter-spacing:.25px;column-gap:1px;}
.grid-nav>div,.grid-hdr>div,.grid-nav-m>div,.grid-hdr-m>div{display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;min-width:0;}
.grid-nav-m>div:not(:last-child),.grid-nav>div:not(:last-child){border-right:1px solid rgba(31,45,61,.06);}
.grid-hdr-m>div:not(:last-child),.grid-hdr>div:not(:last-child){border-right:1px solid rgba(255,255,255,.12);}
.grid-comp{display:grid;grid-template-columns:34px 46px repeat(5,1fr) 36px;font-size:11.5px;text-align:center;padding:4px 1px;align-items:center;border-bottom:1px solid #eee;}
.grid-hdr-comp{display:grid;grid-template-columns:34px 46px repeat(5,1fr) 36px;background:var(--ink);color:#fff;font-size:9px;font-weight:600;text-align:center;padding:4px 1px;letter-spacing:.3px;}
.num{font-weight:600;cursor:pointer;border-radius:4px;user-select:none;padding:1px 1px;transition:transform .08s;font-variant-numeric:tabular-nums;line-height:1.1;display:inline-flex;align-items:center;justify-content:center;width:1.65em;min-width:1.65em;text-align:center;box-sizing:content-box;}
.num:active{transform:scale(1.25);}
.cols{display:flex;gap:10px;overflow-x:auto;align-items:flex-start;padding-bottom:12px;scroll-snap-type:x proximity;overscroll-behavior-x:contain;touch-action:pan-x pan-y;}
.col{min-width:224px;max-width:236px;flex-shrink:0;border-radius:11px;overflow:hidden;border:2px solid #ccc;background:#fff;box-shadow:var(--shadow);scroll-snap-align:start;}
.col.has-m{min-width:365px;max-width:380px;border-width:2.5px;box-shadow:0 2px 10px rgba(0,0,0,.12);}
.col.has-m .col-hdr{font-size:12.5px;padding:7px 3px;}
.col.has-m .grid-hdr-m{background:#0F1E38;position:sticky;top:0;z-index:3;}
.col.has-m .grid-nav-m{font-size:11px;font-weight:600;min-height:28px;}

/* === 2 années côte à côte, toujours visibles, sans scroll horizontal === */
.cols.fit2{display:grid;grid-template-columns:1fr 1fr;gap:6px;overflow-x:hidden;align-items:start;}
.cols.fit2 .col{min-width:0;max-width:none;width:100%;flex:1 1 0;}
.cols.fit2 .grid-nav{grid-template-columns:32px 42px repeat(5,1fr) 36px;font-size:10.5px;}
.cols.fit2 .grid-nav-m,.cols.fit2 .grid-hdr-m{grid-template-columns:28px 34px repeat(5,1fr) 32px repeat(5,1fr) 32px;font-size:10px;}
.cols.fit2 .grid-hdr{grid-template-columns:32px 42px repeat(5,1fr) 36px;}
.cols.fit2 .grid-hdr{font-size:8.5px;}
@media(max-width:420px){
  .cols.fit2{gap:4px;}
  .cols.fit2 .grid-nav{font-size:9px;padding:2px 0;}
  .cols.fit2 .grid-hdr{font-size:7.5px;}
  .cols.fit2 .col{border-width:1.5px;}
}
/* === Mode compact (inspiré de Cybercast) : chiffres nus, colonnes étroites, fond gris alterné === */
.cols.compact .col{min-width:230px;max-width:260px;border-width:1px;border-radius:6px;box-shadow:none;}
.cols.compact .col.has-m{min-width:300px;max-width:330px;}
.cols.compact .col-hdr{font-size:10px;padding:3px 2px;letter-spacing:0;}
.cols.compact .grid-hdr,.cols.compact .grid-hdr-m{font-size:8px;padding:2px 0;letter-spacing:0;background:#fff;color:#222;border-bottom:2px solid #222;}
.cols.compact .grid-hdr>div,.cols.compact .grid-hdr-m>div{border-right:none !important;}
.cols.compact .grid-nav,.cols.compact .grid-nav-m{padding:1px 0;column-gap:0;border-bottom:none;font-size:11px;}
.cols.compact .grid-nav>div,.cols.compact .grid-nav-m>div{border-right:none !important;}
/* fond gris alterné par COLONNE (au lieu de bordures) : c'est ce qui rend la lecture facile en dense */
.cols.compact .grid-nav>div:nth-child(even),.cols.compact .grid-nav-m>div:nth-child(even),
.cols.compact .grid-hdr>div:nth-child(even),.cols.compact .grid-hdr-m>div:nth-child(even){background:rgba(0,0,0,.055);}
.cols.compact .grid-nav:nth-child(even),.cols.compact .grid-nav-m:nth-child(even){background:#fff !important;}
.cols.compact .num{font-weight:500;padding:0;border-radius:2px;}
.cols.compact .grid-nav>div:last-child,.cols.compact .grid-nav-m>div:last-child{background:rgba(0,0,0,.055) !important;color:#222 !important;font-weight:600;border-radius:0;}
.cols.compact .grid-nav-m>div:nth-child(8){background:rgba(0,0,0,.055) !important;color:#222 !important;border-left:none !important;}
/* === Vue normale (pas côte à côte) : chaque année empilée, pleine largeur === */
.cols.stacked{display:block;overflow-x:visible;}
.cols.stacked .col,.cols.stacked .col.has-m{width:100%;min-width:0;max-width:none;margin-bottom:10px;}
.cols.stacked .col-body{max-height:60dvh;overscroll-behavior:contain;}
.cols.frozen{position:relative;}
.cols.frozen .col:first-child{position:sticky;left:0;z-index:5;background:#fff;box-shadow:4px 0 10px rgba(31,45,61,.22);isolation:isolate;}
.cols.frozen .col:first-child .col-hdr{position:sticky;top:0;}
.excel-wrap{position:relative;-webkit-overflow-scrolling:touch;overflow:auto;width:100%;max-width:100%;min-width:0;overscroll-behavior:contain;touch-action:pan-x pan-y;cursor:grab;scroll-snap-type:y proximity;}
.excel-tbl{border-collapse:separate;border-spacing:0;font-size:11.5px;width:max-content;max-width:none;table-layout:auto;}
.excel-tbl tbody tr{scroll-snap-align:start;}
#app-content{width:100%;max-width:100%;min-width:0;overflow-x:hidden;}
html{max-width:100%;overflow-x:hidden;}
.excel-tbl th,.excel-tbl td{padding:5px 1px;text-align:center;white-space:nowrap;overflow:hidden;border-right:1px solid #e2e2e2;border-bottom:1px solid #ececec;}
/* iOS Safari a un bug connu : les cellules "position:sticky" à l'intérieur d'un conteneur
   overflow:auto (comme .excel-wrap) restent visuellement "collées" en retard ou pas du tout
   pendant le défilement tant qu'on ne force pas leur propre calque GPU. -webkit-overflow-scrolling:touch
   aggrave ce bug (scroller "à l'ancienne" qui ne repeint pas les sticky pendant l'inertie) — retiré ci-dessus.
   translateZ(0) force le calque GPU par cellule pour que le collage suive le doigt en temps réel. */
.excel-tbl [style*="sticky"]{transform:translateZ(0);-webkit-transform:translateZ(0);}
.excel-blk{position:sticky;top:0;z-index:6;font-weight:600;font-size:11px;padding:4px;border-right:2px solid rgba(255,255,255,.3);transform:translateZ(0);-webkit-transform:translateZ(0);}
.excel-hd{position:sticky;top:22px;z-index:5;background:var(--ink);color:#fff;font-size:8px;font-weight:700;transform:translateZ(0);-webkit-transform:translateZ(0);}
.excel-frozen{position:sticky;z-index:7;box-shadow:2px 0 5px rgba(31,45,61,.12);transform:translateZ(0);-webkit-transform:translateZ(0);}
th.excel-frozen{z-index:9;}
.excel-td.excel-frozen{background:#fff;}
.col-body{overflow-y:auto;overflow-x:hidden;max-height:calc(100dvh - 200px);overscroll-behavior:contain;touch-action:none;}
.col-hdr{text-align:center;padding:6px 3px;font-weight:600;font-size:12px;position:sticky;top:0;z-index:2;letter-spacing:.3px;}
.popup{position:fixed;z-index:999;background:rgba(24,30,38,.72);color:#fff;border-radius:8px;padding:4px 7px;min-width:80px;max-width:190px;box-shadow:0 6px 22px rgba(0,0,0,.35);pointer-events:none;backdrop-filter:blur(4px);}
.popup-overlay{position:fixed;inset:0;z-index:998;}
.popup-num{font-size:13px;font-weight:700;text-align:center;margin-bottom:2px;color:var(--accent);}
.popup-body{display:flex;flex-wrap:wrap;gap:1px 6px;}
.popup-row{display:flex;align-items:center;gap:2px;line-height:1.2;font-size:9px;white-space:nowrap;}
.popup-label{color:#9AA6B5;font-weight:normal;}
.nmenu{position:fixed;z-index:1000;background:#fff;border-radius:13px;box-shadow:0 10px 36px rgba(31,45,61,.35);overflow-y:auto;overflow-x:hidden;max-height:58vh;width:250px;max-width:calc(100vw - 20px);box-sizing:border-box;border:1px solid var(--line);}
.nmenu-hdr{background:linear-gradient(135deg,#1E3A8A,#1F2D3D);color:var(--accent);font-weight:700;text-align:center;padding:5px;font-size:15px;}
.nmenu-item{padding:7px 13px;font-size:12px;font-weight:500;cursor:pointer;border-bottom:1px solid #F2F4F8;color:#2C3E50;user-select:none;}
.nmenu-item:hover{background:#F5F7FA;}
.nmenu-item:active{background:#EDF1F6;}
.cl-chip{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:7px;font-size:10px;font-weight:700;cursor:pointer;border:2px solid transparent;user-select:none;margin:1px;box-shadow:0 1px 2px rgba(0,0,0,.08);}
.cl-chip.off{opacity:0.35;filter:grayscale(0.6);}
input[type=number]{-webkit-appearance:none;appearance:none;}
input[type=text],input[type=number]{font-family:inherit;}
::-webkit-scrollbar{height:7px;width:7px;}
::-webkit-scrollbar-thumb{background:#C3CCD9;border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

/* VISIBILITE AMELIOREE */
.grid-nav:nth-child(even), .grid-nav-m:nth-child(even){background:#F8FAFF !important;}
.grid-nav-m > div:nth-child(n+9):nth-child(-n+13){color:#6D28D9;font-weight:700;}
.grid-nav > div:last-child, .grid-nav-m > div:nth-child(8){background:#FFF3CD !important;color:#7A5A00 !important;font-weight:800;border-radius:3px;}
.grid-nav-m > div:last-child{background:#EDE7FF !important;color:#4A2D8A !important;font-weight:800;border-radius:3px;}
.grid-nav-m > div:nth-child(8), .grid-hdr-m > div:nth-child(8){border-left:2.5px solid #FF6B35 !important;}


/* FIT2 - si jeu à 10 numéros, passe en 1 colonne pour rester lisible */
.cols.fit2:has(.has-m){grid-template-columns:1fr;}

/* EXCEL MODE - meilleure lisibilité NATIONAL */
.excel-tbl{border-spacing:0;}
.excel-tbl td{font-weight:600;}
.excel-tbl th{letter-spacing:.2px;}

const BENIN_JEU_COLORS={D00:'0E7C7B',D08:'0D9488',D20:'17A398',F11:'1D4E89',F14:'2C6FB0',F18:'4A90D9',S11:'6D28D9',S14:'8B5CF6',S18:'A78BFA'};
function parseBeninAll(){
  if(BENIN_ALL_ROWS) return BENIN_ALL_ROWS;
  BENIN_ALL_ROWS=RAW_BENIN_ALL.trim().split('\n').map(line=>{
    const p=line.split('|');
    const n=[+p[4],+p[5],+p[6],+p[7],+p[8]];
    const s=p[9]===''?null:+p[9];
    const mRaw=[p[10],p[11],p[12],p[13],p[14]];
    const hasM=mRaw.some(v=>v!=='');
    const m=hasM?mRaw.map(v=>v===''?null:+v):null;
    return {jour:p[0],jeu:p[1],d:p[2],y:p[3],n,s,m};
  });
  // Tri : date décroissante (le plus récent en premier), puis — au sein d'une même date — ordre
  // chronologique des heures de tirage (00H avant 08H avant 11H avant 14H avant 18H avant 20H),
  // via BENIN_HEURE_ORDER. Sans ce tri explicite, les jeux d'une même date se retrouvent groupés
  // dans leur ordre d'insertion (ex: D20 avant D00/D08) au lieu d'être ordonnés par heure réelle.
  BENIN_ALL_ROWS.sort((a,b)=>{
    const dateCmp=(b.y+b.d.split('/').reverse().join('')).localeCompare(a.y+a.d.split('/').reverse().join(''));
    if(dateCmp!==0)return dateCmp;
    return BENIN_HEURE_ORDER.indexOf(BENIN_HEURE[b.jeu])-BENIN_HEURE_ORDER.indexOf(BENIN_HEURE[a.jeu]);
  });
  return BENIN_ALL_ROWS;
}

  const GH_DOW_CODE=['SU','MO','TU','WE','TH','FR','SA']; // Date.getDay() : 0=dimanche

    const [dd,mm]=p[1].split('/').map(Number);

    rows.push({jour,jeu:'G21',d:p[1],y:p[2],n,m});

function togoIncidenceHTML(rows){
  if(state.togoJours.length!==1){
    return`<div class="card" style="margin-bottom:8px;background:#FFF7ED;border:1.5px solid #92400E">
      <div style="font-size:11px;font-weight:700;color:#78350F">📊 Incidences historiques (pronostic)</div>
      <div style="font-size:9px;color:#92400E;margin-top:3px">Sélectionne un seul jour (ex: Lundi) dans le filtre ci-dessus pour voir la fréquence historique des numéros de ce jour et t'aider à pronostiquer le prochain.</div>
    </div>`;
  }
  const jour=state.togoJours[0];
  if(!rows.length)return'';
  const freq={};
  const lastSeen={};
  rows.forEach(r=>{ // rows déjà triées du plus récent au plus ancien
    r.n.forEach(n=>{
      freq[n]=(freq[n]||0)+1;
      if(lastSeen[n]===undefined)lastSeen[n]=r.d+'/'+r.y;
    });
  });
  const sorted=Object.keys(freq).map(n=>({num:+n,count:freq[n],last:lastSeen[n]})).sort((a,b)=>b.count-a.count||a.num-b.num);
  const top=sorted.slice(0,15);
  return`<div class="card" style="margin-bottom:8px;background:#FFF7ED;border:1.5px solid #92400E">
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px">
      <div style="font-size:11px;font-weight:700;color:#78350F">📊 Incidences historiques — ${jour} (pronostic)</div>
      <div style="display:flex;gap:4px;margin-left:auto">${addToListButtonsHTML(top.map(x=>x.num))}</div>
    </div>
    <div style="font-size:8.5px;color:#92400E;margin-bottom:8px">Fréquence de chaque numéro sur les ${rows.length} tirage${rows.length>1?'s':''} de ${jour} déjà enregistrés (jeux ${jour} actuellement cochés ci-dessus) — les plus sortis en premier, pour t'aider à pronostiquer le prochain ${jour}. Les boutons 📌 ci-dessus cochent ces ${top.length} numéros d'un coup.</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      ${top.map(x=>`<div style="display:flex;flex-direction:column;align-items:center;background:#fff;border:1px solid #FCD9B6;border-radius:8px;padding:5px 8px;min-width:46px">
        <span style="font-size:15px;font-weight:700;color:#78350F">${x.num}</span>
        <span style="font-size:9px;color:#92400E;font-weight:600">${x.count}×</span>
        <span style="font-size:7.5px;color:#B45309;margin-top:1px">${x.last}</span>
      </div>`).join('')}
    </div>
  </div>`;
}

// ══════ Export Excel générique pour les 4 onglets filtre Jour/Jeu (Bénin/Ghana/Togo/Cameroun) ══════
// columns: [{header, get:(r)=>val, total?:bool}] — exporte TOUS les tirages filtrés (pas juste les 400 affichés)
async function exportCountryFiltre(rows, columns, filenamePrefix, sheetName, btnId){
  if(!rows||!rows.length){alert('Aucun tirage à exporter (vérifie tes filtres)');return;}
  if(typeof ExcelJS==='undefined'){alert("La librairie d'export n'a pas pu se charger (vérifie ta connexion internet), réessaie.");return;}
  const btn=btnId?document.getElementById(btnId):null;
  const btnLabel=btn?btn.textContent:null;
  if(btn)btn.textContent='⏳...';
  try{
    const wb=new ExcelJS.Workbook();
    const ws=wb.addWorksheet(sheetName);
    ws.addRow(columns.map(c=>c.header)).font={bold:true};
    rows.slice(0,400).reverse().forEach(r=>{ // même plafond (400 plus récents) et même ordre que l'affichage écran
      const vals=columns.map(c=>{const v=c.get(r);return v==null?'':v;});
      const row=ws.addRow(vals);
      columns.forEach((c,ci)=>{
        const v=c.get(r);
        const cell=row.getCell(ci+1);
        if(c.total){
          if(v!=null&&v!==''){
            const tc=tC(v);
            cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:hexToARGB(tc[0])}};
            cell.font={color:{argb:hexToARGB(tc[1])},bold:true};
          }
        }else if(c.totalM){
          if(v!=null&&v!==''){
            cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:hexToARGB('#EDE7FF')}};
            cell.font={color:{argb:hexToARGB('#6D28D9')},bold:true};
          }
        }else{
          const bg=typeof c.bg==='function'?c.bg(r):c.bg;
          const fg=typeof c.fg==='function'?c.fg(r):c.fg;
          if(bg)cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:hexToARGB(bg)}};
          if(fg||bg)cell.font={color:{argb:hexToARGB(fg||'#000000')},bold:!!bg};
        }
      });
    });
    ws.columns.forEach(c=>{c.width=10;});
    ws.addRow([]);
    ws.addRow(['Tirages exportés',Math.min(rows.length,400),'Exporté le',new Date().toLocaleDateString('fr-FR')]);
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/octet-stream'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=filenamePrefix+'_'+new Date().toISOString().slice(0,10)+'.xlsx';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  }catch(err){
    alert("Erreur pendant l'export : "+(err&&err.message?err.message:err));
  }finally{
    if(btn)btn.textContent=btnLabel;
  }
}

// ══════ MULTI-PAYS — fusion Bénin + Togo + Cameroun (repérer un numéro qui revient d'un pays à l'autre) ══════
// ══════ CÔTE D'IVOIRE — jeux fusionnés pour Multi-Pays (jour de semaine calculé depuis la date, pas stocké) ══════
const CI_DAY_NAMES=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const CI_PALETTE=['B45309','0E7490','7C2D12','4C1D95','9D174D','166534','1E40AF','92400E','5B21B6','065F46','A16207','831843','1E3A8A','3F6212','6B21A8','C2410C','0F766E','BE185D','3730A3','15803D','9A3412','1D4ED8','86198F','047857','B91C1C','334155','7E22CE','0369A1','A21CAF'];
const CI_GAMES=Object.keys(GAMES).filter(k=>GAMES[k].icon==='🇨🇮').map((k,i)=>({key:k,name:GAMES[k].name,raw:GAMES[k].raw,color:CI_PALETTE[i%CI_PALETTE.length]}));
// Heure de tirage extraite du nom du jeu quand elle y est indiquée (ex: "DIGITAL 21H" → 21,
// "DIGITAL REVEIL 07H" → 7) — sert de tri chronologique au sein d'une même date. Les jeux CI dont
// le nom n'indique pas d'heure (SOUTRA, MOAYE, AWALE...) n'ont pas cette info dans les données ;
// ils gardent alors une position stable (via l'ordre de CI_GAMES) plutôt que d'être mélangés.
function ciHeureNum(jeuKey){
  const g=CI_GAMES.find(x=>x.key===jeuKey);
  if(!g)return -1;
  const m=g.name.match(/(\d{1,2})\s*H\b/i);
  return m?parseInt(m[1],10):-1; // -1 = heure inconnue
}
const CI_JEU_LABELS=Object.fromEntries(CI_GAMES.map(g=>[g.key,g.name]));
const CI_JEU_COLORS=Object.fromEntries(CI_GAMES.map(g=>[g.key,g.color]));
let CI_ALL_ROWS=null;
function parseCIAll(){
  if(CI_ALL_ROWS)return CI_ALL_ROWS;
  CI_ALL_ROWS=[];
  CI_GAMES.forEach(g=>{
    if(!g.raw)return;
    g.raw.trim().split('\n').forEach(line=>{
      if(!line.trim())return;
      const p=line.split('|');
      const t=+p[0],d=p[1],y=p[2];
      const n=[+p[3],+p[4],+p[5],+p[6],+p[7]];
      const s=p[8]!==undefined&&p[8]!==''?+p[8]:n.reduce((a,b)=>a+b,0);
      const bonusRaw=p.slice(9).filter(v=>v!==undefined&&v!=='');
      const bonus=bonusRaw.length?bonusRaw.map(v=>+v):null;
      const[dd,mm]=d.split('/').map(Number);
      const jour=CI_DAY_NAMES[new Date(+y,mm-1,dd).getDay()];
      CI_ALL_ROWS.push({jour,jeu:g.key,t,d,y,n,s,bonus});
    });
  });
  // Tri : date décroissante (le plus récent en premier), puis — au sein d'une même date — heure de
  // tirage décroissante quand elle est connue (ex: DIGITAL 23H avant DIGITAL 21H), sinon l'ordre
  // stable de CI_GAMES. Évite que des jeux ajoutés le même jour à des moments différents se
  // retrouvent mélangés au lieu de suivre la chronologie réelle des tirages.
  CI_ALL_ROWS.sort((a,b)=>{
    const dateCmp=(b.y+b.d.split('/').reverse().join('')).localeCompare(a.y+a.d.split('/').reverse().join(''));
    if(dateCmp!==0)return dateCmp;
    const heureCmp=ciHeureNum(b.jeu)-ciHeureNum(a.jeu);
    if(heureCmp!==0)return heureCmp;
    return CI_GAMES.findIndex(x=>x.key===b.jeu)-CI_GAMES.findIndex(x=>x.key===a.jeu);
  });
  return CI_ALL_ROWS;
}

const IT_JOUR_ORDER=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const IT_PALETTE=['1D4E89','B45309','166534','7C2D12','4C1D95','9D174D','0E7490','92400E','5B21B6','065F46','A16207','C2410C'];
const IT_GAMES=Object.keys(GAMES).filter(k=>GAMES[k].icon==='🇮🇹').map((k,i)=>({key:k,name:GAMES[k].name,raw:GAMES[k].raw,color:IT_PALETTE[i%IT_PALETTE.length]}));
const IT_JEU_LABELS=Object.fromEntries(IT_GAMES.map(g=>[g.key,g.name]));
const IT_JEU_COLORS=Object.fromEntries(IT_GAMES.map(g=>[g.key,g.color]));
let IT_ALL_ROWS=null;
function parseITAll(){
  if(IT_ALL_ROWS)return IT_ALL_ROWS;
  IT_ALL_ROWS=[];
  IT_GAMES.forEach(g=>{
    if(!g.raw)return;
    const n6=!!GAMES[g.key].n6;
    g.raw.trim().split('\n').forEach(line=>{
      if(!line.trim())return;
      const p=line.split('|');
      const t=+p[0],d=p[1],y=p[2];
      const n=n6?[+p[3],+p[4],+p[5],+p[6],+p[7],+p[8]]:[+p[3],+p[4],+p[5],+p[6],+p[7]];
      const sIdx=n6?9:8;
      const s=p[sIdx]!==undefined&&p[sIdx]!==''?+p[sIdx]:n.reduce((a,b)=>a+b,0);
      const bonusRaw=p.slice(sIdx+1).filter(v=>v!==undefined&&v!=='');
      const bonus=bonusRaw.length?bonusRaw.map(v=>+v):null;
      const[dd,mm]=d.split('/').map(Number);
      const jour=CI_DAY_NAMES[new Date(+y,mm-1,dd).getDay()];
      IT_ALL_ROWS.push({jour,jeu:g.key,t,d,y,n,s,bonus});
    });
  });
  // Tri : date décroissante, puis — au sein d'une même date (toutes les roues tirent le même soir) —
  // l'ordre stable de IT_GAMES.
  IT_ALL_ROWS.sort((a,b)=>{
    const dateCmp=(b.y+b.d.split('/').reverse().join('')).localeCompare(a.y+a.d.split('/').reverse().join(''));
    if(dateCmp!==0)return dateCmp;
    return IT_GAMES.findIndex(x=>x.key===b.jeu)-IT_GAMES.findIndex(x=>x.key===a.jeu);
  });
  return IT_ALL_ROWS;
}

let MULTI_PAYS_ROWS=null;
// Heure de tirage (0-23) toutes origines confondues, pour trier chronologiquement au sein d'une
// même date dans la vue Multi-Pays fusionnée — sans quoi les tirages d'un même jour se
// retrouvaient groupés par pays (dans l'ordre où chaque pays est fusionné) plutôt que par heure
// réelle. -1 = heure inconnue pour ce jeu (reste en dernier, ordre stable).
function multiHeureNum(pays,jeuRawKey){
  if(pays==='benin'){const h=BENIN_HEURE[jeuRawKey];return h?parseInt(h,10):-1;}
  if(pays==='togo'){const g=TOGO_GAMES.find(x=>x.key===jeuRawKey);return g?parseInt(g.heure,10):-1;}
  if(pays==='cameroun'){const lbl=CAMEROUN_JEU_LABELS[jeuRawKey]||'';const m=lbl.match(/(\d{1,2})h/i);return m?parseInt(m[1],10):-1;}
  if(pays==='cotedivoire')return ciHeureNum(jeuRawKey);
  if(pays==='ghana')return -1; // pas d'heure de tirage connue dans les données Ghana (jour uniquement)
  if(pays==='ghalpha')return -1; // pas d'heure de tirage connue (jour uniquement)
  if(pays==='italie')return -1; // pas d'heure de tirage connue dans les données Italie (jour uniquement)
  if(pays==='burkina')return -1; // pas d'heure de tirage connue dans les données Burkina Faso (jour uniquement)
  return -1;
}

    rows.push({pays,jourLabel:GHANA_JOUR_LABELS[r.jour],

      d:r.d,y:r.y,sortKey:sortKeyOf(r.d,r.y),heureNum:multiHeureNum(pays,r.jeu),n:r.n,s:r.n.reduce((a,b)=>a+b,0),bonus:r.m});
  });
  parseITAll().forEach(r=>{
    rows.push({pays:'italie',jourLabel:r.jour,
      jeuKey:'italie:'+r.jeu,jeuLabel:MULTI_JEU_MAP['italie:'+r.jeu]?MULTI_JEU_MAP['italie:'+r.jeu].label:r.jeu,jeuColor:IT_JEU_COLORS[r.jeu],

// ══════ Détection automatique — numéros répétés d'un loto à l'autre (fixe, non paramétrable) ══════
function buildRepeatsFromRows(list){
  const byNum={};
  list.forEach(r=>{
    r.n.forEach(num=>{
      if(!byNum[num])byNum[num]=[];
      byNum[num].push({pays:r.pays,jeuLabel:r.jeuLabel,jeuKey:r.jeuKey,d:r.d,y:r.y,sortKey:r.sortKey});
    });
  });
  const results=[];
  Object.keys(byNum).forEach(numStr=>{
    const occ=byNum[numStr];
    const distinctJeux=[...new Set(occ.map(o=>o.jeuKey))];
    if(distinctJeux.length>=2){
      occ.sort((a,b)=>b.sortKey-a.sortKey);
      results.push({num:+numStr,nbJeux:distinctJeux.length,nbOcc:occ.length,occ});
    }
  });
  results.sort((a,b)=>b.nbJeux-a.nbJeux||b.nbOcc-a.nbOcc||a.num-b.num);
  return results;
}
let MULTI_REPEATS_WEEK_CACHE=null;
function detectMultiRepeatsWeek(){
  if(MULTI_REPEATS_WEEK_CACHE)return MULTI_REPEATS_WEEK_CACHE;
  const rows=parseMultiPaysAll(); // toujours TOUS les pays/jeux/jours, peu importe les filtres à l'écran
  if(!rows.length){MULTI_REPEATS_WEEK_CACHE=[];return[];}
  const maxKey=rows[0].sortKey; // rows triés du plus récent au plus ancien
  const yy=Math.floor(maxKey/10000),mm=Math.floor((maxKey%10000)/100),dd=maxKey%100;
  const cutoffDate=new Date(yy,mm-1,dd);
  cutoffDate.setDate(cutoffDate.getDate()-6); // 7 jours glissants (jour courant inclus)
  const cutoffKey=cutoffDate.getFullYear()*10000+(cutoffDate.getMonth()+1)*100+cutoffDate.getDate();
  const recent=rows.filter(r=>r.sortKey>=cutoffKey);
  MULTI_REPEATS_WEEK_CACHE=buildRepeatsFromRows(recent);
  return MULTI_REPEATS_WEEK_CACHE;
}
let MULTI_REPEATS_DAY_CACHE=null;
function detectMultiRepeatsDay(){
  if(MULTI_REPEATS_DAY_CACHE)return MULTI_REPEATS_DAY_CACHE;
  const rows=parseMultiPaysAll();
  if(!rows.length){MULTI_REPEATS_DAY_CACHE=[];return[];}
  const maxKey=rows[0].sortKey; // jour le plus récent présent dans les données
  const today=rows.filter(r=>r.sortKey===maxKey);
  MULTI_REPEATS_DAY_CACHE=buildRepeatsFromRows(today);
  return MULTI_REPEATS_DAY_CACHE;
}

// ══════ Miroirs croisés entre jeux (un numéro sort dans un jeu, son miroir — ex: 27↔72 — sort dans un AUTRE jeu) ══════
function buildMirrorCrossFromRows(rows){
  const byNum={};
  rows.forEach(r=>{
    r.n.forEach(num=>{
      if(!byNum[num])byNum[num]=[];
      byNum[num].push({pays:r.pays,jeuLabel:r.jeuLabel,jeuKey:r.jeuKey,d:r.d,y:r.y,sortKey:r.sortKey});
    });
  });
  const seenPairs=new Set();
  const results=[];
  Object.keys(byNum).forEach(numStr=>{
    const num=+numStr;
    const mir=MIR[num];
    if(mir==null||!byNum[mir])return; // pas de miroir défini, ou le miroir n'est sorti nulle part sur la période
    const pairKey=[num,mir].sort((a,b)=>a-b).join('-');
    if(seenPairs.has(pairKey))return;
    seenPairs.add(pairKey);
    const occNum=byNum[num],occMir=byNum[mir];
    const jeuxNum=new Set(occNum.map(o=>o.jeuKey)),jeuxMir=new Set(occMir.map(o=>o.jeuKey));
    // pas intéressant si num et miroir ne sortent QUE dans le même unique jeu (pas "croisé")
    if(jeuxNum.size===1&&jeuxMir.size===1&&[...jeuxNum][0]===[...jeuxMir][0])return;
    results.push({num,mir,occNum,occMir,totalOcc:occNum.length+occMir.length});
  });
  results.sort((a,b)=>b.totalOcc-a.totalOcc||a.num-b.num);
  return results;
}

// ══════ Généralisation à TOUS les éléments de classification (Counter/Bonanza/Malta/Key/Turning/Partner/Shadow/Equiv/Miroir) ══════
// Même principe que les miroirs croisés (MIR[]), mais applicable à n'importe quel élément de
// classification déjà présent dans l'app (CL_DEF/getCL) : un numéro sort dans un jeu, son
// dérivé (par cette classification) sort dans un AUTRE jeu, sur la même période.
function derivFor(num,typeKey){
  if(typeKey==='miroir')return MIR[num];
  const c=getCL(num);
  const v=c[typeKey];
  return (v!=null&&v>=1&&v<=90)?v:undefined;
}
function buildClassifCrossFromRows(rows,typeKey){
  const byNum={};
  rows.forEach(r=>{
    r.n.forEach(num=>{
      if(!byNum[num])byNum[num]=[];
      byNum[num].push({pays:r.pays,jeuLabel:r.jeuLabel,jeuKey:r.jeuKey,d:r.d,y:r.y,sortKey:r.sortKey});
    });
  });
  const seenPairs=new Set();
  const results=[];
  Object.keys(byNum).forEach(numStr=>{
    const num=+numStr;
    const der=derivFor(num,typeKey);
    if(der==null||!byNum[der])return;
    const pairKey=[num,der].sort((a,b)=>a-b).join('-');
    if(seenPairs.has(pairKey))return;
    seenPairs.add(pairKey);
    const occNum=byNum[num],occDer=byNum[der];
    const jeuxNum=new Set(occNum.map(o=>o.jeuKey)),jeuxDer=new Set(occDer.map(o=>o.jeuKey));
    if(jeuxNum.size===1&&jeuxDer.size===1&&[...jeuxNum][0]===[...jeuxDer][0])return;
    results.push({num,der,occNum,occDer,totalOcc:occNum.length+occDer.length});
  });
  results.sort((a,b)=>b.totalOcc-a.totalOcc||a.num-b.num);
  return results;
}
let MULTI_CLASSIF_DAY_CACHE={};
function detectMultiClassifDay(typeKey){
  if(MULTI_CLASSIF_DAY_CACHE[typeKey])return MULTI_CLASSIF_DAY_CACHE[typeKey];
  const res=buildClassifCrossFromRows(aiTodayRowsAll(),typeKey);
  MULTI_CLASSIF_DAY_CACHE[typeKey]=res;
  return res;
}
let MULTI_CLASSIF_WEEK_CACHE={};
function detectMultiClassifWeek(typeKey){
  if(MULTI_CLASSIF_WEEK_CACHE[typeKey])return MULTI_CLASSIF_WEEK_CACHE[typeKey];
  const rows=parseMultiPaysAll();
  if(!rows.length){MULTI_CLASSIF_WEEK_CACHE[typeKey]=[];return[];}
  const maxKey=rows[0].sortKey;
  const yy=Math.floor(maxKey/10000),mm=Math.floor((maxKey%10000)/100),dd=maxKey%100;
  const cutoffDate=new Date(yy,mm-1,dd);
  cutoffDate.setDate(cutoffDate.getDate()-6);
  const cutoffKey=cutoffDate.getFullYear()*10000+(cutoffDate.getMonth()+1)*100+cutoffDate.getDate();
  const recent=rows.filter(r=>r.sortKey>=cutoffKey);
  const res=buildClassifCrossFromRows(recent,typeKey);
  MULTI_CLASSIF_WEEK_CACHE[typeKey]=res;
  return res;
}

async function exportMultiClassif(results,filenamePrefix,btnId,typeLabel){
  if(!results||!results.length){alert('Aucune paire à exporter');return;}
  if(typeof ExcelJS==='undefined'){alert("La librairie d'export n'a pas pu se charger (vérifie ta connexion internet), réessaie.");return;}
  const btn=btnId?document.getElementById(btnId):null;
  const btnLabel=btn?btn.textContent:null;
  if(btn)btn.textContent='⏳...';
  try{
    const wb=new ExcelJS.Workbook();
    const ws=wb.addWorksheet(typeLabel.slice(0,28));
    ws.addRow(['Numéro',typeLabel,'Détail Numéro','Détail '+typeLabel]).font={bold:true};
    results.forEach(r=>{
      const detailNum=r.occNum.map(o=>`${MULTI_PAYS_LABELS[o.pays]} ${o.jeuLabel} (${o.d}/${o.y})`).join(' | ');
      const detailDer=r.occDer.map(o=>`${MULTI_PAYS_LABELS[o.pays]} ${o.jeuLabel} (${o.d}/${o.y})`).join(' | ');
      const row=ws.addRow([r.num,r.der,detailNum,detailDer]);
      row.getCell(1).font={bold:true,color:{argb:'FFFFFFFF'}};row.getCell(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1565C0'}};
      row.getCell(2).font={bold:true,color:{argb:'FFFFFFFF'}};row.getCell(2).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1565C0'}};
    });
    ws.columns.forEach((c,i)=>{c.width=i<2?12:60;});
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/octet-stream'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=filenamePrefix+'_'+new Date().toISOString().slice(0,10)+'.xlsx';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  }catch(err){
    alert("Erreur pendant l'export : "+(err&&err.message?err.message:err));
  }finally{
    if(btn)btn.textContent=btnLabel;
  }
}

// Helpers canvas : coins arrondis et texte espacé (letterSpacing n'existe pas partout).
function _rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);return;}
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function _spaced(ctx,txt,cx,y,sp){
  const chars=[...txt];
  let total=0;chars.forEach(c=>{total+=ctx.measureText(c).width+sp;});
  total-=sp;
  let x=cx-total/2;const prev=ctx.textAlign;ctx.textAlign='left';
  chars.forEach(c=>{ctx.fillText(c,x,y);x+=ctx.measureText(c).width+sp;});
  ctx.textAlign=prev;
  return total;
}
// Losange évidé avec la petite croix au centre (le logo des modèles)
function _diamond(ctx,cx,cy,size,color){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(Math.PI/4);
  ctx.strokeStyle=color;ctx.lineWidth=size*0.17;ctx.lineJoin='miter';
  ctx.strokeRect(-size/2,-size/2,size,size);
  ctx.restore();
  ctx.save();ctx.strokeStyle=color;ctx.globalAlpha=.30;ctx.lineWidth=size*0.055;
  const d=size*0.30;
  ctx.beginPath();ctx.moveTo(cx-d,cy-d);ctx.lineTo(cx+d,cy+d);
  ctx.moveTo(cx+d,cy-d);ctx.lineTo(cx-d,cy+d);ctx.stroke();
  ctx.restore();
}
// Valeurs partagées par l'aperçu à l'écran ET l'image exportée : une seule source
// de vérité, pour que ce que tu vois soit exactement ce que tu télécharges.
// Éclaircit une couleur #rrggbb vers le blanc (k=0 → couleur, k=1 → blanc)
function _lighten(hex,k){
  const h=hex.replace('#','');
  const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const m=v=>Math.round(v+(255-v)*k);
  return '#'+[m(r),m(g),m(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function pronosticVisual(){

  const custom=PRONO_BALL_COLORS.find(x=>x.key===state.pronosticBallColor);

function drawPronosticPoster(canvas){
  const v=pronosticVisual();
  const {ACC,LIGHT,BADGE,heure,titre,nums}=v;
  // Mise en page : 5 boules par rangée, hauteur adaptée au nombre de numéros.
  // Le rayon est calculé pour qu'une rangée complète TIENNE dans la carte
  // (sinon les boules débordaient : 5×116 + 4×26 = 684 px pour 608 px utiles).
  const perRow=5, GAP=18;
  const M=26, PAD=34;                       // marge extérieure, padding de la carte
  const W=660;
  const avail=W-2*(M+PAD);
  const R=Math.min(58,Math.floor((avail-(perRow-1)*GAP)/(2*perRow)));
  const rows=Math.max(1,Math.ceil(nums.length/perRow));
  const ballsTop=470;
  const H=ballsTop+rows*(R*2+GAP)-GAP+150;
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  ctx.textAlign='center';
  // Alignement du paragraphe (logo, badge, textes) : gauche / centré / droite
  const al=state.pronosticAlign||'center';
  const AX = al==='left' ? M+PAD+120 : al==='right' ? W-M-PAD-120 : W/2;
  // fond sombre + carte blanche arrondie
  ctx.fillStyle='#131C2E';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#FFFFFF';_rr(ctx,M,M,W-M*2,H-M*2,42);ctx.fill();
  // logo losange
  _diamond(ctx,AX,M+94,74,ACC);
  // badge LONATO / LNB
  ctx.font='800 26px Poppins, Arial, sans-serif';
  const bw=ctx.measureText(BADGE).width+8*BADGE.length+70;
  ctx.fillStyle=ACC;_rr(ctx,AX-bw/2,M+150,bw,64,32);ctx.fill();
  ctx.fillStyle='#FFFFFF';_spaced(ctx,BADGE,AX,M+192,8);
  // COMBINAISON CHANCE
  ctx.fillStyle='#8A93A6';ctx.font='700 22px Poppins, Arial, sans-serif';
  _spaced(ctx,'COMBINAISON CHANCE',AX,M+266,7);
  // titre du jeu (police, taille et alignement réglables)
  const fontDef=PRONO_FONTS.find(f=>f.key===state.pronosticTitleFont)||PRONO_FONTS[0];
  const kSize=(PRONO_TITLE_SIZES.find(s=>s[0]===state.pronosticTitleSize)||PRONO_TITLE_SIZES[1])[2];
  ctx.fillStyle=ACC;
  let ts=Math.round(54*kSize);ctx.font=`900 ${ts}px ${fontDef.family}`;
  while(ctx.measureText(titre).width>W-2*(M+PAD)&&ts>20){ts-=2;ctx.font=`900 ${ts}px ${fontDef.family}`;}
  ctx.fillText(titre,AX,M+336);
  // heure
  if(heure){ctx.fillStyle=ACC;ctx.font=`800 ${Math.round(42*kSize)}px Poppins, Arial, sans-serif`;ctx.fillText(heure,AX,M+396);}
  // boules : 5 par rangée — fond clair de la couleur choisie, contour seulement si demandé
  for(let i=0;i<nums.length;i++){
    const row=Math.floor(i/perRow);
    const inRow=Math.min(perRow,nums.length-row*perRow);
    const totalW=inRow*(R*2)+(inRow-1)*GAP;
    const x0=(al==='left'?M+PAD:al==='right'?W-M-PAD-totalW:W/2-totalW/2)+R;
    const cx=x0+(i%perRow)*(R*2+GAP);
    const cy=ballsTop+row*(R*2+GAP)+R;
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
    if(v.conic){
      const cg=ctx.createConicGradient?ctx.createConicGradient(0,cx,cy):null;
      if(cg){['#f00','#ff0','#0f0','#0ff','#00f','#f0f','#f00'].forEach((c,ci,a)=>cg.addColorStop(ci/(a.length-1),c));ctx.fillStyle=cg;}
      else ctx.fillStyle=LIGHT;
    }else ctx.fillStyle=LIGHT;
    ctx.fill();
    if(v.outline){ctx.strokeStyle=v.outline;ctx.lineWidth=5;ctx.stroke();}
    ctx.fillStyle=v.conic?'#FFFFFF':'#131C2E';
    const tsz={petit:32,normal:40,grand:46}[state.pronosticTextSize]||40;
    ctx.font=`800 ${tsz}px Poppins, Arial, sans-serif`;
    ctx.textBaseline='middle';ctx.fillText(String(nums[i]),cx,cy+2);ctx.textBaseline='alphabetic';
  }
  // pastille GOOD LUCK
  const gy=ballsTop+rows*(R*2+GAP)-GAP+46;
  ctx.font='800 24px Poppins, Arial, sans-serif';
  const gw=ctx.measureText('GOOD LUCK').width+9*9+80;
  ctx.fillStyle='#EEF1F6';_rr(ctx,AX-gw/2,gy,gw,62,31);ctx.fill();
  ctx.fillStyle='#5A6478';_spaced(ctx,'GOOD LUCK',AX,gy+40,9);
}

// ── Accès localStorage centralisé et sécurisé (évite de dupliquer try/catch partout) ──
function lsGetOr(key,fallback){try{return localStorage.getItem(key)||fallback;}catch(_){return fallback;}}
// Palette sombre : vraies couleurs (fond bleu nuit, cartes ardoise, texte clair, accent doré)
// au lieu d'un filtre invert() qui donnait des couleurs criardes/imprévisibles.
const DARK_VARS={'--bg':'#0B1220','--card':'#141B2E','--line':'#26314A','--txt':'#E8ECF3','--muted':'#8FA0BC','--ink':'#E8ECF3','--ink2':'#C3CCDC','--shadow':'0 1px 3px rgba(0,0,0,.45),0 4px 14px rgba(0,0,0,.35)'};
function applyTheme(){
  document.body.style.filter='';
  const appContent=document.getElementById('app-content');
  if(appContent){
    appContent.style.filter='';
    appContent.style.zoom=state.zoom;
  }
  const root=document.documentElement;
  if(state.darkMode){
    Object.keys(DARK_VARS).forEach(k=>root.style.setProperty(k,DARK_VARS[k]));
    document.body.style.colorScheme='dark';
  }else{
    Object.keys(DARK_VARS).forEach(k=>root.style.removeProperty(k));
    document.body.style.colorScheme='';
  }
}
function toggleDarkMode(){state.darkMode=!state.darkMode;lsSet('lmj_dark',state.darkMode?'1':'0');applyTheme();render();}
function setZoom(z){state.zoom=z;lsSet('lmj_zoom',String(z));applyTheme();render();}
const ZOOM_LEVELS=[0.5,0.85,1,1.15,1.3,1.5];
function zoomStep(dir){
  let idx=ZOOM_LEVELS.indexOf(state.zoom);
  if(idx<0)idx=1; // valeur inconnue -> repli sur 100%
  idx=Math.max(0,Math.min(ZOOM_LEVELS.length-1,idx+dir));
  setZoom(ZOOM_LEVELS[idx]);
}

// ── Synchro robuste : horodatage PAR CLÉ + garde anti-onglet-périmé ─────────
// Chaque clé a un horodatage local (__sbts_<clé>) qui reflète la dernière version connue
// par CET onglet. On ne remplace jamais une version plus récente : ni en écrivant (push,
// qui revérifie le distant avant d'écraser), ni en lisant (pull, qui ignore les lignes
// pas plus fraîches que ce qu'on connaît déjà). Corrige le bug "onglet resté ouvert avec
// un ancien coloriage qui repousse par-dessus un nettoyage fait sur un autre appareil".
const SB_TS_PREFIX='__sbts_';

}

// PUSH : avant d'écraser le distant, on relit son updated_at. baseTs = horodatage connu par
// cet onglet AVANT l'écriture locale (capturé dans lsSet, pas relu après coup) : si le
// serveur a bougé depuis, on adopte sa version au lieu d'écraser avec notre valeur périmée.
function sbPush(key,rawVal,ts,baseTs){
  if(!SB)return;
  let value;
  try{ value=JSON.parse(rawVal); }catch(_){ value=rawVal; }
  const stamp=ts||new Date().toISOString();
  sbSyncPending++;
  sbSetStatus('☁️ Synchro…','#F59E0B');
  const done=(msg,color)=>{
    sbSyncPending=Math.max(0,sbSyncPending-1);
    if(sbSyncPending===0)sbSetStatus(msg,color);
  };
  SB.from('app_kv').select('key,value,updated_at').eq('key',key).limit(1)
    .then(({data,error})=>{
      const remote=(!error&&data&&data.length)?data[0]:null;
      // Conflit : le distant est plus récent que la version connue localement par cet onglet.
      if(remote&&sbT(remote.updated_at)>(baseTs||0)){
        sbApplyRemote(remote);
        done('☁️ Version plus récente reçue','#F59E0B');
        sbRefreshUI();
        return null;
      }
      return SB.from('app_kv').upsert({key:key,value:value,updated_at:stamp})
        .then(({error:upErr})=>{
          if(!upErr)sbSetTs(key,stamp);
          done(upErr?'⚠️ Synchro échouée':'☁️ Synchro OK',upErr?'#DC2626':'#16A34A');
        });
    })
    .catch(()=>{ done('⚠️ Synchro échouée','#DC2626'); });

let sbPullInFlight=null;
async function sbPullAll(quiet){
  if(!SB)return false;

async function sbPullAllInner(quiet){
  try{
    if(!quiet)sbSetStatus('☁️ Récupération…','#F59E0B');
    const {data,error}=await SB.from('app_kv').select('key,value,updated_at');
    if(error||!data){if(!quiet)sbSetStatus('⚠️ Synchro indisponible','#DC2626');return false;}
    let changed=0;
    data.forEach(row=>{
      try{
        const remoteTs=sbT(row.updated_at);
        const localTs=sbGetTs(row.key);
        const hasLocal=localStorage.getItem(row.key)!==null;
        if(!hasLocal||!localTs||remoteTs>localTs){
          sbApplyRemote(row);
          changed++;
        }
      }catch(_){}
    });
    if(!quiet)sbSetStatus(data.length?'☁️ Synchronisé':'☁️ Prêt (rien à synchro)','#16A34A');
    else if(changed)sbSetStatus('🔄 '+changed+' mise(s) à jour reçue(s)','#16A34A');
    return changed;
  }catch(_){

    return false;
  }

function defaultGameForToday(){

// pour un jeu qui suit le calendrier hebdomadaire officiel (propriété "day", ex: "Mardi 13h")
function remainingWeeklyDraws(yr){
  if(!GAME.day)return [];
  const nowY=new Date().getFullYear();
  if(parseInt(yr)!==nowY)return [];
  const joursIdx={'Dimanche':0,'Lundi':1,'Mardi':2,'Mercredi':3,'Jeudi':4,'Vendredi':5,'Samedi':6};
  const jourNom=GAME.day.split(' ')[0];
  const targetDow=joursIdx[jourNom];
  if(targetDow==null)return [];
  const rows=BY_YEAR[yr]||[];
  if(!rows.length)return [];
  const last=rows[rows.length-1]; // dernier tirage réel de l'année (le plus récent dans ce bloc)
  const [ld,lm]=last.d.split('/').map(Number);
  let cur=new Date(parseInt(yr),lm-1,ld);
  cur.setDate(cur.getDate()+1);
  while(cur.getDay()!==targetDow)cur.setDate(cur.getDate()+1);
  const out=[];
  let t=last.t+1;
  const endOfYear=new Date(parseInt(yr),11,31);
  while(cur<=endOfYear){
    out.push({t,d:String(cur.getDate()).padStart(2,'0')+'/'+String(cur.getMonth()+1).padStart(2,'0')});
    t++;
    cur.setDate(cur.getDate()+7);
  }
  return out;
}
// Lignes vides du 1er janvier jusqu'au premier tirage réel de l'année
// (pour un jeu qui a débuté en cours d'année, ex: CASH dont l'historique commence en juillet 2023)
function precedingWeeklyPlaceholders(yr){
  if(!GAME.day)return [];
  const joursIdx={'Dimanche':0,'Lundi':1,'Mardi':2,'Mercredi':3,'Jeudi':4,'Vendredi':5,'Samedi':6};
  const jourNom=GAME.day.split(' ')[0];
  const targetDow=joursIdx[jourNom];
  if(targetDow==null)return [];
  const rows=BY_YEAR[yr]||[];
  if(!rows.length)return [];
  const first=rows[0]; // premier tirage réel de l'année (le plus ancien dans ce bloc, tri croissant)
  const [fd,fm]=first.d.split('/').map(Number);
  const firstDate=new Date(parseInt(yr),fm-1,fd);
  let cur=new Date(parseInt(yr),0,1);
  while(cur.getDay()!==targetDow)cur.setDate(cur.getDate()+1);
  const out=[];
  while(cur<firstDate){
    out.push({d:String(cur.getDate()).padStart(2,'0')+'/'+String(cur.getMonth()+1).padStart(2,'0')});
    cur.setDate(cur.getDate()+7);
  }
  return out;
}

  if(!n||n<1||n>90)return{};const i=n-1;
  return{counter:CNT[i],bonanza:BON[i],malta:MLT[i],key:KEY[i],turning:TRN[i],partner:PRT[i],shadow:SHD[i],equiv:EQV[i],code:CODE[i]};
}
// Retourne un court libellé "Abréviation valeur" pour le PREMIER élément de classification
// présent d'un numéro (utilisé pour afficher l'élément de classification à côté des numéros de la liste 2)
function repereClassLabel(n){
  const c=getCL(n);
  const rows=[['C',c.counter],['B',c.bonanza],['Ma',c.malta],['K',c.key],['T',c.turning],['P',c.partner],['S',c.shadow],['Co',c.code],['E',c.equiv]];
  if(MIR[n]!=null)rows.push(['Mi',MIR[n]]);
  const hit=rows.find(([l,v])=>v!=null&&v!==''&&v!==0);
  return hit?hit[0]+':'+hit[1]:'';
}
// Même badge de classification que dans la grille (numSpan), réutilisable partout où un
// numéro repéré est affiché ailleurs que dans la grille principale (panneaux Liste A/B,
// scan multi-jeux) — pour que "partout dans l'app" (promesse du toggle 🧩) soit tenue.
function classifSuffixHTML(n){
  const lbl=repereClassLabel(n);
  return lbl?`<sub style="font-size:6px;font-weight:700;opacity:.9;margin-left:2px;display:inline-block;vertical-align:middle;writing-mode:vertical-rl;text-orientation:upright;line-height:1;letter-spacing:-1.5px">${lbl}</sub>`:'';
}

// Retourne les dérivés d'un numéro par type de classification
function getDerivsByType(n){
  const c=getCL(n); const res={};
  CL_DEF.forEach(cl=>{
    if(cl.key==='miroir'){if(MIR[n])res['miroir']=MIR[n];}
    else if(c[cl.key]&&c[cl.key]>=1&&c[cl.key]<=90)res[cl.key]=c[cl.key];
  });
  return res;
}

function tC(s){if(s<150)return['#C8E6C9','#1B5E20'];if(s<250)return['#FFF9C4','#7B5E00'];if(s<300)return['#FFCCBC','#BF360C'];return['#EF9A9A','#B71C1C'];}
// Luminance perçue d'une couleur hex (#RRGGBB ou RRGGBB) — remplace l'ancienne heuristique parseInt(c,16)>0x888888 qui donnait du texte noir illisible sur certains fonds sombres (ex: marron 92400E)
function isLightBg(hex){
  if(!hex)return false;
  const h=String(hex).replace('#','');
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  if(isNaN(r)||isNaN(g)||isNaN(b))return false;
  return(0.299*r+0.587*g+0.114*b)>150;
}

function loadColorState(key){
  try{
    const raw=lsGetOr('loto_colors_'+key,'');
    const d=raw?JSON.parse(raw):null;
    state.colored=(d&&d.colored)||{};
    state.coloredCells=(d&&d.coloredCells)||{};
    state.colored2=(d&&d.colored2)||{};
    state.coloredCells2=(d&&d.coloredCells2)||{};
    state.markRows=(d&&d.markRows)||{};
    state.blockRows=(d&&d.blockRows)||{};
    state.anchors=(d&&d.anchors)||{}; state.anchorLocks=(d&&d.anchorLocks)||{};
  }catch(_){state.colored={};state.coloredCells={};state.colored2={};state.coloredCells2={};state.markRows={};state.blockRows={};state.anchors={};state.anchorLocks={};}
}

// ── Annuler la dernière action de coloriage (pile d'historique, 20 étapes max) ──
function pushColorUndo(){
  try{
    state.colorUndoStack.push(JSON.stringify({
      colored:state.colored, coloredCells:state.coloredCells,
      colored2:state.colored2, coloredCells2:state.coloredCells2,
      markRows:state.markRows, blockRows:state.blockRows, anchors:state.anchors, anchorLocks:state.anchorLocks,
      colorIdx:state.colorIdx, rowMultiNums:[...state.rowMultiNums]
    }));
    if(state.colorUndoStack.length>20)state.colorUndoStack.shift();
  }catch(_){}
}
function undoColorAction(){
  const snap=state.colorUndoStack.pop();
  if(!snap){render();return;}
  try{
    const d=JSON.parse(snap);
    state.colored=d.colored||{};
    state.coloredCells=d.coloredCells||{};
    state.colored2=d.colored2||{};
    state.coloredCells2=d.coloredCells2||{};
    state.markRows=d.markRows||{};
    state.blockRows=d.blockRows||{};
    state.anchors=d.anchors||{}; state.anchorLocks=d.anchorLocks||{};
    state.colorIdx=d.colorIdx||0;
    state.rowMultiNums=new Set(d.rowMultiNums||[]);
  }catch(_){}
  saveColorState();
  render();
}

// (Miroir même ligne + Miroir superposé + Superposition actifs, aucune
// analyse explicitement choisie). Utilisé par "🧹 Tout annuler" et "Tout effacer".
function clearAllColorsEverywhere(){
  pushColorUndo(); // permet d'annuler le nettoyage du jeu affiché avec ↩️ Annuler
  // 1) Jeu actuellement affiché
  state.colored={};state.coloredCells={};state.colored2={};state.coloredCells2={};state.colorIdx=0;state.rowMultiNums=new Set();
  state.markRows={};state.blockRows={};
  saveColorState();
  // 2) Tous les autres lotos qui ont un coloriage enregistré (local + cloud via lsSet)
  try{
    Object.keys(localStorage).filter(k=>k.startsWith('loto_colors_')).forEach(k=>{
      if(k==='loto_colors_'+GAME.key)return; // déjà fait ci-dessus
      lsSet(k,JSON.stringify({colored:{},coloredCells:{},colored2:{},coloredCells2:{},markRows:{},blockRows:{},anchors:{},anchorLocks:{}}));
    });
  }catch(_){}
  // 3) Réglages globaux : mode par défaut
  state.repereAlways=false; // désactive l'affichage des repérés (leurs définitions/instantanés restent sauvegardés, réactivables via "✅ Avec repérés")
  state.repere2Always=false; // désactive l'affichage de la liste 2 (sa définition reste sauvegardée, réactivable via "✅ Avec liste 2")
  state.anMode='none'; // désélectionne toute analyse explicitement choisie (ex: Repérés) pour revenir au vrai mode par défaut
  state.mirLAlways=true;  // rétablit le mode par défaut : Miroir même ligne actif
  state.mirPAlways=true;  // rétablit le mode par défaut : Miroir superposé actif
  state.superposAlways=true; // rétablit le mode par défaut : Mêmes numéros superposés actif
  state.elmHL=[];state.elmHLNum=null;state.elmHLDraft=null;state.elmHLCount=null; // éteint les cercles "éléments de la classification en exergue"
}
// ══════ Mode vierge — état totalement vide, SANS repère, aucun numéro coloré, MÊME les
// miroirs/superposition (contrairement à "Tout effacer" qui, lui, remet Miroir même ligne /
// Miroir superposé / Superposition ACTIFS par défaut). Demandé explicitement : "je veux un état
// où l'appli devient sans repère, vide, aucun numéro coloré, même les miroir[s]". ══════
function clearAllColorsBlank(){
  clearAllColorsEverywhere(); // couleurs manuelles, repères, blocs — sur tous les lotos
  state.mirLAlways=false;  // éteint Miroir même ligne
  state.mirPAlways=false;  // éteint Miroir superposé
  state.superposAlways=false; // éteint Mêmes numéros superposés
}
// ══════ Réinitialiser à l'état par défaut — remise à zéro complète, différent de "Tout annuler" ══════
// "Tout annuler" (clearAllColorsEverywhere) n'efface que couleurs/repères/blocs + remet Miroir/Superposition par défaut.
// "Réinitialiser" va plus loin : Liste A/B, double vue, filtres Bénin/Togo/Cameroun/Ghana, thème, réglages écarts/couleurs,
// historique de recherche, pronostics, etc. Le carnet de suivi (journal) et les plans notés sont volontairement conservés.
function resetAppDefault(){
  if(!confirm("Réinitialiser l'application à l'état par défaut ?\n\nEfface : couleurs, repères, Liste A/B, double vue, filtres (Bénin/Togo/Cameroun/Ghana), thème, réglages écarts/couleurs, historique de recherche, pronostics...\n\nLe carnet de suivi et les plans notés sont conservés.\n\nCette action est irréversible et va recharger l'application."))return;
  try{
    Object.keys(localStorage).forEach(k=>{
      if(!(k.startsWith('lmj_')||k.startsWith('loto_')))return;
      if(k==='loto_journal')return; // conservé
      if(k.startsWith('loto_plans_'))return; // conservé
      lsRemove(k);
    });
  }catch(_){}
  location.reload();
}

function lumFg(hex){
  const h=hex.replace('#','');
  const full=h.length===3?h.split('').map(c=>c+c).join(''):h;
  const r=parseInt(full.slice(0,2),16),g=parseInt(full.slice(2,4),16),b=parseInt(full.slice(4,6),16);
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  return lum>0.55?'#000':'#fff';
}

// Résout la valeur affichée à une case donnée (cid = "tirage_position", ex "1850_0" ou "1850_m2")
function valueAtCid(cid){
  const us=cid.lastIndexOf('_');
  if(us<0)return null;
  const t=parseInt(cid.slice(0,us));
  const posStr=cid.slice(us+1);
  const row=T[IDX[t]];
  if(!row)return null;
  if(posStr[0]==='m'){const mi=parseInt(posStr.slice(1));return row.m?row.m[mi]:null;}
  const ni=parseInt(posStr);
  return row.n?row.n[ni]:null;
}
function colorAll(n,pane2){
  pushColorUndo();
  const coloredStore=pane2?state.colored2:state.colored;
  const cellsStore=pane2?state.coloredCells2:state.coloredCells;
  if(coloredStore[n]){
    delete coloredStore[n];
    // Enlève aussi les cases coloriées individuellement ("ce numéro seulement") qui correspondent à ce même numéro,
    // sinon elles restaient allumées et donnaient l'impression que le retrait "refusait" de fonctionner.
    Object.keys(cellsStore).forEach(cid=>{
      if(valueAtCid(cid)===n)delete cellsStore[cid];
    });
  }else{
    coloredStore[n]=pickHl();
  }
  saveColorState();
  closePopup();render();
}
function colorCell(n,cid,pane2){
  pushColorUndo();
  const cellsStore=pane2?state.coloredCells2:state.coloredCells;
  if(cellsStore[cid])delete cellsStore[cid];
  else cellsStore[cid]=pickHl();
  saveColorState();
  closePopup();render();
}

// Logique de coloration/décoloration d'une ligne de tirage, partagée par colorRow et colorRowKey
function toggleRowColor(row,hasM){
  if(!row)return;
  pushColorUndo();
  const nums=hasM&&row.m?[...row.n,...row.m]:[...row.n];
  const allColored=nums.every(n=>state.colored[n]);
  if(allColored){
    nums.forEach(n=>{delete state.colored[n];state.rowMultiNums.delete(n);});
  }else{
    const c=nextPaletteColor();
    nums.forEach(n=>{
      if(state.colored[n])state.rowMultiNums.add(n); // déjà coloré par une autre ligne -> partagé
      state.colored[n]=c;
    });
  }
  saveColorState();
  render();
}
function colorRow(t,hasM){
  toggleRowColor(T[IDX[t]],hasM);
}

// ══════ SAISIE DE NOUVEAUX TIRAGES ══════
// N'accepte que des nombres ENTIERS de 1 à 90 (rejette vide, décimales, négatifs, zéro, texte).
function parseLotoNum(raw){
  const s=(raw||'').trim();
  if(!/^\d{1,2}$/.test(s))return NaN; // pas un entier positif de 1 ou 2 chiffres (donc pas de "-", ".", lettres, espaces...)
  const n=parseInt(s,10);
  return (n>=1&&n<=90)?n:NaN;
}
function addDraw(){
  const g=id=>document.getElementById(id);
  const t=parseInt(g('ad-t').value);
  const dd=g('ad-d').value.trim();
  const yy=g('ad-y').value.trim();
  const ns=[1,2,3,4,5].map(i=>parseLotoNum(g('ad-n'+i).value));
  if(!t||t<1){alert('Numéro de tirage invalide');return;}
  if(!/^\d{2}\/\d{2}$/.test(dd)){alert('Date au format JJ/MM (ex: 08/07)');return;}
  if(!/^\d{4}$/.test(yy)){alert('Année invalide');return;}
  if(ns.some(n=>isNaN(n))){alert('Les 5 premiers numéros doivent être des nombres ENTIERS entre 1 et 90 (pas de décimales, ni négatif, ni zéro)');return;}
  let ms=null;
  if(GAME.hasM){
    const bn=GAME.bonusN||5; // certains jeux (ex: KADOO) n'ont que 2 numéros bonus, pas 5
    const raw5=[1,2,3,4,5].map(i=>parseLotoNum(g('ad-m'+i).value));
    if(bn<5){
      const used=raw5.slice(0,bn);
      const usedOk=used.every(n=>!isNaN(n));
      if(usedOk){
        ms=used; // seuls les bn numéros réels sont stockés ; le reste est complété au chargement
      }else if(raw5.some(n=>!isNaN(n))){
        alert(`Bonus : remplis les ${bn} premiers champs (entiers 1-90) ou laisse tout vide`);return;
      }
    }else{
      const msOk=raw5.every(n=>!isNaN(n));
      if(GAME.sum10&&!msOk){alert('Ce jeu tire 10 numéros : remplis aussi les 5 numéros N6–N10 (entiers entre 1 et 90)');return;}
      if(!GAME.sum10&&!msOk){
        if(raw5.some(n=>!isNaN(n))){alert('Numéros machine : remplis les 5 (entiers entre 1 et 90) ou laisse tout vide');return;}
      }else{
        ms=raw5;
      }
    }
  }
  const s=ns.reduce((a,b)=>a+b,0)+(GAME.sum10&&ms?ms.reduce((a,b)=>a+b,0):0);
  let line=`${t}|${dd}|${yy}|${ns.join('|')}|${s}`;
  if(ms)line+='|'+ms.join('|');
  // Mode insertion : on décale d'abord tous les tirages suivants de +1
  if(state.shiftAfter!=null){
    const afterT=state.shiftAfter;
    if(t!==afterT+1){
      if(!confirm('Le N° saisi ('+t+') ne suit pas le N°'+afterT+'.\nInsérer quand même en N°'+(afterT+1)+' ?')){return;}
    }
    const n=applyInsertShift(afterT,line);
    delete GAMES[GAME.key]._d;
    loadGame(GAME.key);
    state.showAdd=true;
    state.prefillT=null;state.prefillD='';state.prefillY='';state.prefillN=null;state.prefillM=null;
    render();
    alert('Tirage inséré en N°'+(afterT+1)+'.\n'+n+' tirage(s) suivant(s) renumérotés automatiquement.');
    return;
  }
  const extras=getExtras(GAME.key).filter(l=>parseInt(l.split('|')[0])!==t);
  extras.push(line);
  saveExtras(GAME.key,extras);
  delete GAMES[GAME.key]._d;
  loadGame(GAME.key);
  state.showAdd=true;
  state.prefillT=null;state.prefillD='';state.prefillY='';state.prefillN=null;state.prefillM=null;
  render();
}
function delDraw(t){
  const extras=getExtras(GAME.key).filter(l=>parseInt(l.split('|')[0])!==t);
  saveExtras(GAME.key,extras);
  delete GAMES[GAME.key]._d;
  loadGame(GAME.key);
  render();
}

// ═══ LIGNES-TROUS À COMPLÉTER ══════════════════════════════════════════════
// Quand un N° de tirage manque dans la suite (ex : le 20 absent entre 19 et 21),
// on affiche une ligne vide en pointillés, avec les champs à remplir sur place.
// Ces lignes ne sont PAS des données : elles n'entrent dans aucune statistique
// tant qu'elles ne sont pas enregistrées.
function gapNumbersFor(yr){
  const rows=rowsForYear(yr);
  if(rows.length<2)return [];
  const have=new Set(rows.map(r=>r.t));
  const lo=Math.min(...rows.map(r=>r.t)), hi=Math.max(...rows.map(r=>r.t));
  if(hi-lo>3000)return [];            // garde-fou : numérotation non séquentielle
  const out=[];
  for(let t=lo+1;t<hi;t++)if(!have.has(t))out.push(t);
  return out;
}

    <div><span onclick="saveGapDraw(${t})" title="Enregistrer ce tirage" style="cursor:pointer;font-size:11px">✔</span></div>`;
  if(GAME.hasM){

function saveGapDraw(t){

  loadGame(GAME.key);
  render();
}

// ═══ INSERTION AVEC RENUMÉROTATION AUTOMATIQUE ════════════════════════════
// Problème : « Insérer » plaçait le tirage en N°+1, ce qui ÉCRASAIT le tirage
// existant à ce numéro. Ici, on décale de +1 tous les tirages suivants, puis on
// place le nouveau dans le trou ainsi créé. Les données de base étant figées
// dans le fichier, on réécrit l'ensemble dans le stockage local (qui a priorité).

// Toutes les lignes actuelles du jeu (base + saisies), indexées par N° de tirage.
function currentLinesByT(){
  const map={};
  GAME.raw.trim().split('\n').forEach(l=>{const t=parseInt(l.split('|')[0]);if(t)map[t]=l;});
  getExtras(GAME.key).forEach(l=>{const t=parseInt(l.split('|')[0]);if(t)map[t]=l;});
  return map;
}
function _withT(line,nt){const p=line.split('|');p[0]=String(nt);return p.join('|');}
// Décale les repères liés à un N° de tirage (couleurs, lignes repère, pronostics)
function _shiftTKeyedState(afterT){
  const bump=t=>t>afterT?t+1:t;
  const nb={};Object.keys(state.blockRows||{}).forEach(k=>{nb[bump(+k)]=state.blockRows[k];});state.blockRows=nb;
  const nm={};Object.keys(state.markRows||{}).forEach(k=>{nm[bump(+k)]=state.markRows[k];});state.markRows=nm;
  const nc={};
  Object.keys(state.coloredCells||{}).forEach(k=>{
    // formes rencontrées : "123_4", "123_m2", "an0_123_4", "cle_123_4"
    const m=k.match(/^(.*?)(\d+)(_m?\d+)$/);
    if(m){nc[m[1]+bump(+m[2])+m[3]]=state.coloredCells[k];}else{nc[k]=state.coloredCells[k];}
  });
  state.coloredCells=nc;
  const preds=loadPredictions(GAME.key), np={};
  Object.keys(preds).forEach(k=>{np[bump(+k)]=preds[k];});
  lsSet('loto_predictions_'+GAME.key,JSON.stringify(np));
}
// Ouvre le formulaire en mode insertion-décalage
function insertShiftAt(afterT){
  if(!T[IDX[afterT]]){alert('Tirage N°'+afterT+' introuvable');return;}
  state.shiftAfter=afterT;
  state.prefillT=afterT+1;
  state.prefillD='';state.prefillY=String(T[IDX[afterT]].y);
  state.prefillN=null;state.prefillM=null;
  state.showAdd=true;
  render();
  setTimeout(()=>{const el=document.getElementById('ad-d');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},50);
}
// Applique le décalage puis enregistre la nouvelle ligne (appelée par addDraw)
function applyInsertShift(afterT,line){
  const map=currentLinesByT();
  const nums=Object.keys(map).map(Number).sort((a,b)=>a-b);
  const decales=nums.filter(t=>t>afterT).length;
  const out=[];
  nums.forEach(t=>{out.push(t>afterT?_withT(map[t],t+1):map[t]);});
  out.push(_withT(line,afterT+1));
  out.sort((a,b)=>parseInt(b.split('|')[0])-parseInt(a.split('|')[0]));
  saveExtras(GAME.key,out);
  _shiftTKeyedState(afterT);
  state.shiftAfter=null;
  return decales;
}

  if(confirm('Insérer un tirage juste après le N°'+r.t+' ?\n\nTous les tirages suivants seront renumérotés (+1) automatiquement.'))insertShiftAt(r.t);
}

    </div>`:''}
  </div>${rowActionsBarHTML()}`;
}

// Rendu d'un numéro avec sa couleur
function numSpan(n, extra, cid){
  if(n==null||isNaN(n))return `<span class="num" style="color:#ccc;font-size:${extra&&extra.isM?'11px':'12px'}">–</span>`;
  // Le coloriage MANUEL n'est JAMAIS masqué, dans aucune vue — toujours visible,
  // toujours modifiable (clic jamais bloqué). SEULE EXCEPTION : le volet "sans"
  // de la double vue masque aussi le coloriage manuel (_DV_SUPPRESS), pour que
  // les deux volets restent VISUELLEMENT différents — c'est tout l'intérêt de
  // la double vue (comparaison avec/sans repérés ET coloriage).
  // Double vue : chaque volet a désormais SON PROPRE coloriage manuel, totalement
  // indépendant de l'autre (extra.pane2 = volet "sans repérés") — stores séparés
  // colored2/coloredCells2, jamais masqués (contrairement à avant où _DV_SUPPRESS
  // cachait tout le coloriage manuel dans le volet "sans").
  const pane2=!!(extra&&extra.pane2);
  const colC=cid?(pane2?state.coloredCells2[cid]:state.coloredCells[cid]):null;
  const col=pane2?state.colored2[n]:state.colored[n];
  let bg='transparent',fg=extra&&extra.isM?'#7B1FA2':'#1a1a1a',fs=extra&&extra.fs?extra.fs+'px':(extra&&extra.isM?'12px':'12px'),sh='',bd='none',ul='none',rad='4px',sym='';
  const SYM_MAP={croix:'✕',etoile:'★',coeur:'♥',coche:'✓'};
  const applyHl=c=>{
    if(c.style==='box'){bd='2px solid '+c.bg;bg='transparent';fs='13px';}
    else if(c.style==='underline'){ul='3px solid '+c.bg;bg='transparent';fg=c.bg;fs='13px';}
    else if(c.style==='text'){bg='transparent';fg=c.bg;fs='14px';}
    else if(SYM_MAP[c.style]){bg='transparent';fg='#1a1a1a';fs='13px';sym=`<span style="color:${c.bg};font-size:11px;font-weight:700;margin-left:1px">${SYM_MAP[c.style]}</span>`;}
    else{bg=c.bg;fg=c.fg;fs='13px';sh='0 1px 2px rgba(0,0,0,.2)';}
  };
  // Numéro repéré (prédéfini, actif) : couleur pleine par défaut (comme un coloriage manuel),
  // modifiable ensuite au clic (le style choisi manuellement — colC/col — reste prioritaire).
  const repereMark=(!_DV_SUPPRESS&&state.repereAlways!==false&&state.repereDefined&&state.repereDefined[n]&&state.repereActive[n]!==false)?state.repereDefined[n]:null;
  const repere2Mark=(!_DV_SUPPRESS&&state.repere2Always!==false&&state.repere2Defined&&state.repere2Defined[n]&&state.repere2Active[n]!==false)?state.repere2Defined[n]:null;
  // Priorité à la vue par défaut : les 3 couches toujours actives (miroir même
  // ligne, miroir superposé, mêmes numéros superposés) passent maintenant devant
  // le coloriage manuel/repérés, pour que les deux numéros d'une même paire
  // miroir soient TOUJOURS mis en évidence ensemble (ex: 67 et 76).
  if(extra&&extra.isSrc){bg='#059669';fg='#fff';}
  else if(extra&&extra.an){bg='#fff';fg=extra.an[0];fs='13px';sh='0 1px 3px rgba(0,0,0,.15)';rad='50%';bd='2px solid '+extra.an[0];}
  else if(extra&&extra.isMirNav)applyHl({bg:state.mirLColor||'#1565C0',fg:'#fff',style:state.mirLStyle});
  else if(extra&&extra.mirP)applyHl({bg:state.mirPColor||'#6A1B9A',fg:'#fff',style:state.mirPStyle});
  else if(extra&&extra.superpos)applyHl({bg:state.superposColor||'#0891B2',fg:'#fff',style:state.superposStyle});
  else if(colC)applyHl(colC);
  else if(col)applyHl(col);
  // Le style de repereMark/repere2Mark est maintenant tenu à jour par setRepereDisplayStyle()
  // (réécrit sur toutes les entrées stockées dès qu'on change le réglage global), donc plus
  // besoin de l'écraser ici au rendu — applyHl lit directement le style correct.
  else if(repereMark)applyHl(repereMark);
  else if(repere2Mark)applyHl(repere2Mark);
  else if(extra&&extra.clKey){
    // numéro dérivé — couleur de sa classification
    const clDef=CL_DEF.find(c=>c.key===extra.clKey);
    if(clDef){bg=clDef.bg;fg=clDef.fg;fs='13px';sh='0 1px 2px rgba(0,0,0,.15)';}
  }else if(extra&&extra.isComm){
    bg=extra.commBg;fg='#fff';fs='13px';sh='0 1px 3px rgba(0,0,0,.25)';
  }else if(extra&&extra.pair){
    bd='2.5px solid '+extra.pair[0];bg='transparent';fg='#1a1a1a';fs='13px';
  }
  const ulCss=ul!=='none'?`border-bottom:${ul};padding-bottom:1px;`:'';
  const sharedCss=state.rowMultiNums.has(n)?'outline:2px dashed #000;outline-offset:1px;':'';
  const padCss=rad==='50%'?'display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;':'';
  // Numéro repéré (prédéfini, actif) : ajoute son élément de classification en petit, à côté, si activé
  const isRepere=!!repereMark&&state.repereShowClass!==false;
  const isRepere2=!!repere2Mark&&state.repere2ShowClass!==false;
  const clLbl=(isRepere||isRepere2)?repereClassLabel(n):'';
  const clSuffix=clLbl?classifSuffixHTML(n):'';
  // Le badge chiffre a une largeur fixe pour l'alignement (voir .num) : trop étroit
  // pour loger le label de classification à côté sans le faire chevaucher le chiffre.
  // On élargit la boîte uniquement pour les numéros qui portent ce label.
  // Les badges ronds (rad:50%) ont une hauteur fixe de 19px : trop bas pour la
  // même étiquette empilée verticalement (ex: "C:47" = 4 caractères de haut),
  // donc on relâche aussi la hauteur pour ces badges quand l'étiquette est présente.
  const clWidthCss=clLbl?`width:auto;min-width:2.3em;padding:2px;${rad==='50%'?'height:auto;min-height:19px;border-radius:10px;':''}`:'';
  const titleTxt=state.rowMultiNums.has(n)?'Ce numéro appartient à plusieurs lignes coloriées':(isRepere?'🎯 Numéro repéré'+(clLbl?' — '+clLbl:''):(isRepere2?'🎯 Numéro liste 2'+(clLbl?' — '+clLbl:''):''));
  return `<span class="num" onclick="onNum(${n},event,'${cid||''}',${pane2?'true':'false'})" onmouseenter="numOver(${n},event)" onmouseleave="numOut()" ontouchstart="numTouchStart(${n},event)" ontouchend="numTouchEnd(event)" ontouchmove="numTouchCancel()" style="color:${fg};background:${bg};font-size:${fs};box-shadow:${sh};border:${bd};border-radius:${rad};${padCss}${ulCss}${sharedCss}${clWidthCss}" title="${titleTxt}">${n}${clSuffix}${sym}</span>`;
}

// Calcul comparaison
// Détecte, au sein d'une même ligne (5 numéros), les paires liées par une classification active (ex: 01 & 46 = Counter, diff 45)
function rowPairMark(row){
  const nums=row.n, out=[null,null,null,null,null];
  for(let i=0;i<nums.length;i++){
    if(out[i])continue;
    for(let j=0;j<nums.length;j++){
      if(i===j||out[j])continue;
      for(const cl of CL_DEF){
        if(!state.clActive[cl.key])continue;
        const dA=getDerivsByType(nums[i])[cl.key];
        const dB=getDerivsByType(nums[j])[cl.key];
        if(dA===nums[j]||dB===nums[i]){
          out[i]=[cl.bg,cl.fg];out[j]=[cl.bg,cl.fg];
          break;
        }
      }
      if(out[i])break;
    }
  }
  return out;
}

function calcComp(){
  const act=state.plages.slice(0,state.np);
  const pRows=act.map(cfg=>{
    const ri=IDX[cfg.t]; if(ri===undefined)return[];
    const nb=Math.min(Math.max(cfg.nb,1),200); const rows=[];
    if(state.inv){for(let i=ri;i>=0&&rows.length<nb;i--)rows.push(T[i]);}
    else{for(let i=ri;i<T.length&&rows.length<nb;i++)rows.push(T[i]);}
    return rows;
  });
  const maxL=Math.max(...pRows.map(r=>r.length));
  const LA=[];
  for(let li=0;li<maxL;li++){
    const lr=pRows.map(rows=>rows[li]||null);
    // Numéros communs sur cette ligne (≥2 plages)
    const all=new Set(lr.flatMap(r=>r?r.n:[]));
    const comm=new Set();
    all.forEach(n=>{if(lr.filter(r=>r&&r.n.includes(n)).length>=2)comm.add(n);});
    // Pour chaque numéro commun, ses dérivés par type de classification
    // numDeriv[n] = clKey (le type de classification qui produit ce dérivé)
    const numDeriv={};
    comm.forEach(cn=>{
      const derivs=getDerivsByType(cn);
      Object.entries(derivs).forEach(([clKey,dv])=>{
        if(!comm.has(dv) && state.clActive[clKey]){
          if(!numDeriv[dv]) numDeriv[dv]=clKey; // premier type trouvé
        }
      });
    });
    LA.push({comm, numDeriv});
  }
  state.compRes={pRows,LA,act};
}

// ══════ VOIR LES PASS — historique des tirages suivants après chaque apparition ══════
function passData(){
  const nums=state.search;
  if(!nums.length)return[];
  const out=[];
  T.forEach((row,gi)=>{
    if(!searchMatch(row,nums,state.searchPosMode,state.searchPosIdx))return;
    const nexts=[];
    for(let k=1;k<=state.passN;k++){
      const ni=gi-k; // plus récent
      if(ni>=0)nexts.push(T[ni]);
    }
    out.push({row,nexts});
  });
  return out; // du plus ancien au plus récent naturellement car T est récent->ancien et on parcourt dans l'ordre
}
function passRender(){
  const data=passData();
  if(!data.length)return`<div style="text-align:center;color:#aaa;padding:16px;font-size:11px">Aucun tirage trouvé pour [${state.search.join(', ')}]</div>`;
  return`<div style="display:flex;flex-direction:column;gap:6px">
    ${data.map(({row,nexts})=>{
      const tc=tC(row.s);

        <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:${nexts.length?'4px':'0'}">

// ══════ Diagonales de 5 chiffres — tranches de 5 tirages consécutifs lues en diagonale ══════
// Sens alterné : lignes 1-5 → D1,D2,D3,D4,D5 (avant) ; lignes 6-10 → D5,D4,D3,D2,D1 (arrière) ; etc.
function computeDiagonals(rows){
  const diags=[];
  for(let start=0;start+5<=rows.length;start+=5){
    const forward=(Math.floor(start/5))%2===0;
    const cells=[];
    for(let k=0;k<5;k++){
      const ri=start+k;
      const col=forward?k:4-k;
      cells.push({ri,col,val:rows[ri].n[col]});
    }
    diags.push({start,forward,cells,vals:cells.map(c=>c.val),sum:cells.reduce((a,c)=>a+c.val,0)});
  }
  return diags;
}

// ══════ GÉNÉRATEUR DE GRILLES ══════
function genGrid(){
  const n=Math.min(Math.max(state.genN,2),10);
  const nl=Math.min(Math.max(state.genLines,1),30);
  let pool=[];
  if(state.genMode==='random'){
    pool=Array.from({length:90},(_,i)=>i+1);
  }else if(state.genMode==='hot'||state.genMode==='cold'){
    const f=Array(91).fill(0);T.slice(0,Math.min(200,T.length)).forEach(r=>{r.n.forEach(x=>f[x]++);if(r.m)r.m.forEach(x=>f[x]++);});
    const order=Array.from({length:90},(_,i)=>i+1).sort((a,b)=>state.genMode==='hot'?f[b]-f[a]:f[a]-f[b]);
    pool=order.slice(0,30);
  }else if(state.genMode==='retard'){
    const first={};T.forEach((r,i)=>{r.n.forEach(x=>{if(first[x]===undefined)first[x]=i;});if(r.m)r.m.forEach(x=>{if(first[x]===undefined)first[x]=i;});});
    const list=Array.from({length:90},(_,i)=>i+1).sort((a,b)=>(first[b]??T.length)-(first[a]??T.length));
    pool=list.slice(0,30);
  }else if(state.genMode==='mixed'){
    pool=Array.from({length:90},(_,i)=>i+1);
  }
  const lines=[];
  const seen=new Set();
  const maxCombos=nCr(pool.length,n);
  for(let l=0;l<nl;l++){
    let picked,key,tries=0,best=null,bestDiff=Infinity;
    do{
      picked=new Set();
      while(picked.size<n&&picked.size<pool.length){
        picked.add(pool[Math.floor(Math.random()*pool.length)]);
      }
      key=[...picked].sort((a,b)=>a-b).join(',');
      tries++;
      if(state.genTotalOn){
        const sum=[...picked].reduce((a,b)=>a+b,0);
        const diff=Math.abs(sum-state.genTotal);
        if(diff<bestDiff){bestDiff=diff;best=[...picked];}
        if(diff>state.genTotalTol)continue; // hors tolérance, on retente
      }
    }while(((state.genNoDup&&seen.has(key))||(state.genTotalOn&&bestDiff>state.genTotalTol))&&tries<400&&seen.size<maxCombos);
    const finalPick=(state.genTotalOn&&bestDiff>state.genTotalTol&&best)?best:[...picked];
    key=finalPick.sort((a,b)=>a-b).join(',');
    seen.add(key);
    lines.push(finalPick);
  }
  state.genResult=lines;
  render();
}
function nCr(n,r){if(r>n)return 0;let res=1;for(let i=0;i<r;i++)res=res*(n-i)/(i+1);return Math.round(res);}
function suggestFromDraws(draws){
  // draws: tableau de tirages {n:[...]} trié récent->ancien
  if(!draws||!draws.length)return null;
  const win=Math.min(Math.max(state.sugWin||100,10),draws.length);
  const recent=draws.slice(0,win);
  const freq=Array(91).fill(0);
  recent.forEach(r=>r.n.forEach(n=>{if(n>=1&&n<=90)freq[n]++;}));
  const firstSeen={};
  draws.forEach((r,i)=>r.n.forEach(n=>{if(firstSeen[n]===undefined)firstSeen[n]=i;}));
  const maxFreq=Math.max(1,...freq.slice(1));
  const maxRet=draws.length;
  const scored=[];
  for(let n=1;n<=90;n++){
    const fN=freq[n]/maxFreq;
    const rN=(firstSeen[n]===undefined?maxRet:firstSeen[n])/maxRet;
    let score;
    if(state.sugMode==='chaud')score=fN;
    else if(state.sugMode==='retard')score=rN;
    else score=0.55*fN+0.45*rN;
    scored.push({n,score,f:freq[n],ret:firstSeen[n]===undefined?maxRet:firstSeen[n]});
  }
  scored.sort((a,b)=>b.score-a.score||a.n-b.n);
  let pick=scored.slice(0,Math.min(Math.max(state.sugN,1),15));
  if(state.sugMode==='equilibre'){
    const byDec={},final=[];
    for(const x of scored){const d=Math.floor((x.n-1)/10);byDec[d]=(byDec[d]||0);if(byDec[d]<2){final.push(x);byDec[d]++;}if(final.length>=state.sugN)break;}
    if(final.length>=state.sugN)pick=final;
  }
  pick=pick.slice(0,state.sugN).sort((a,b)=>a.n-b.n);
  return{pick,win};
}

function drawsForGame(key){
  try{
    const g=GAMES[key];
    const base=parseLines(g.raw.trim().split('\n'));
    const extras=parseLines(getExtras(key));
    const byT={};base.forEach(r=>byT[r.t]=r);extras.forEach(r=>byT[r.t]=r);
    return Object.values(byT).sort((a,b)=>b.t-a.t);
  }catch(e){return[];}
}

function qpPreset(k,lines,across){state.qpN=k;state.qpLines=lines;state.qpNoRepeatAcross=!!across;state.qpRepeat=false;quickPick();}
function quickPick(){
  const k=Math.min(Math.max(state.qpN||6,1),20);
  const nl=Math.min(Math.max(state.qpLines||1,1),15);
  const newGrids=[];
  let globalUsed=new Set(); // pour couverture sans répétition entre grilles
  for(let g=0;g<nl;g++){
    let grille;
    if(state.qpRepeat){
      grille=[];for(let i=0;i<k;i++)grille.push(1+Math.floor(Math.random()*90));
    }else if(state.qpNoRepeatAcross){
      // pool = numéros pas encore utilisés dans les grilles précédentes
      let avail=[];for(let n=1;n<=90;n++)if(!globalUsed.has(n))avail.push(n);
      if(avail.length<k){globalUsed=new Set();avail=Array.from({length:90},(_,i)=>i+1);} // reset si épuisé
      for(let i=avail.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[avail[i],avail[j]]=[avail[j],avail[i]];}
      grille=avail.slice(0,k);
      grille.forEach(n=>globalUsed.add(n));
    }else{
      const pool=Array.from({length:90},(_,i)=>i+1);
      for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
      grille=pool.slice(0,k);
    }
    newGrids.push(grille.sort((a,b)=>a-b));
  }
  // les plus récentes en haut
  newGrids.reverse().forEach(gr=>state.qpGrids.unshift(gr));
  while(state.qpGrids.length>60)state.qpGrids.pop();
  render();
}
function clearQP(){state.qpGrids=[];render();}
function delQP(i){state.qpGrids.splice(i,1);render();}
function qpHTML(){
  // palette de couleurs par grille (façon Lottery Balls)

function planAnalyze(){
  const nums=state.planNums;
  if(nums.length<2)return null;
  const maxK=Math.min(nums.length,5);
  const hist={};for(let k=2;k<=maxK;k++)hist[k]=[];
  T.forEach(row=>{
    const all=row.m?[...row.n,...row.m]:row.n;
    const hit=nums.filter(n=>all.includes(n));
    if(hit.length>=2)hist[Math.min(hit.length,maxK)]?.push({row,hit});
  });
  return{nums,maxK,hist};
}
function planRender(){
  const res=planAnalyze();
  if(!res)return`<div style="text-align:center;color:#aaa;padding:10px;font-size:11px">Entre au moins 2 numéros</div>`;
  const{nums,maxK,hist}=res;
  let html=`<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px">
    ${[...Array(maxK-1)].map((_,i)=>{
      const k=maxK-i;
      const list=hist[k]||[];
      const bg=k===maxK?'#059669':k>=4?'#F59E0B':'#64748B';
      return`<div style="background:${bg};color:#fff;border-radius:8px;padding:4px 9px;text-align:center">
        <div style="font-size:15px;font-weight:700">${list.length}</div>

      </div>`;
    }).join('')}
  </div>`;
  const top=(hist[maxK]||[]).slice(0,8);
  if(top.length){
    html+=`<div style="font-size:9px;font-weight:500;color:#555;margin-bottom:3px">Meilleures correspondances (${maxK}/${nums.length}) :</div>
    <div style="display:flex;flex-direction:column;gap:3px;max-height:220px;overflow-y:auto">
      ${top.map(({row,hit})=>{const tc=tC(row.s);return`<div style="display:flex;align-items:center;gap:3px;flex-wrap:wrap;border:1px solid #E5E9F0;border-radius:6px;padding:3px 6px">
        <span style="font-weight:700;color:#1F2D3D;font-size:10px">${GAME.name} ${row.t}</span>
        <span style="font-size:8px;color:#888">${row.d}/${row.y}</span>
        ${row.n.map(n=>numSpan(n,{isSrc:hit.includes(n)})).join('')}
        ${row.m?row.m.map(n=>numSpan(n,{isM:true,isSrc:hit.includes(n)})).join(''):''}
        <span style="font-weight:500;color:${tc[1]};background:${tc[0]};border-radius:3px;padding:0 4px;font-size:9px">${row.s}</span>
      </div>`;}).join('')}
    </div>`;
  }else{
    html+=`<div style="font-size:10px;color:#aaa">Aucune combinaison de ${maxK} numéros n'est encore sortie ensemble — bonne chance !</div>`;
  }
  return html;
}

function hexToRgb(hex){
  hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
  return[parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)];
}
function darken(hex,f){
  // f: 0..1, assombrit la couleur
  let[r,g,b]=hexToRgb(hex);
  r=Math.round(r*(1-f));g=Math.round(g*(1-f));b=Math.round(b*(1-f));
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function lum(hex){const[r,g,b]=hexToRgb(hex);return (0.299*r+0.587*g+0.114*b)/255;}
